# Bottleneck production stack: Caddy (HTTPS) -> API -> Postgres + sidecar.
#   production: cp deploy/.env.example .env && chmod 600 .env && docker compose up -d --build
#   local:      npm run stack:up   (uses deploy/dev.env, plain http on http://localhost:8080)
# Only Caddy publishes ports. db, sidecar and api are reachable only on the compose networks.
name: bottleneck

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *hardened
    image: postgres:17-alpine
    user: postgres
    read_only: true
    environment:
      POSTGRES_USER: bottleneck
      POSTGRES_DB: bottleneck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottleneck -d bottleneck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  sidecar:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/sidecar/Dockerfile
    image: bottleneck-sidecar:local
    read_only: true
    environment:
      PORT: "8080"
      CONCURRENCY: ${SIDECAR_CONCURRENCY:-1}
      WORKER_MEMORY_MB: ${SIDECAR_WORKER_MEMORY_MB:-768}
    tmpfs: [/tmp]
    networks: [backend]
    mem_limit: 1280m
    cpus: 1.5

  api:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: bottleneck-api:local
    read_only: true
    depends_on:
      db: { condition: service_healthy }
      sidecar: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Bottleneck: "Host=db;Port=5432;Database=bottleneck;Username=bottleneck;Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"
      Uploads__Path: /data/uploads
      Sidecar__BaseUrl: http://sidecar:8080
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost}
      # Trust X-Forwarded-For only from Caddy's network (fixed subnet below); ForwardLimit stays 1.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownNetworks__0: 10.89.1.0/24
      OpenApi__Enabled: ${API_DOCS_ENABLED:-false}
    volumes:
      - uploads:/data/uploads
    tmpfs: [/tmp]
    networks: [backend, edge]
    mem_limit: 768m
    cpus: 1.0

  caddy:
    <<: *hardened
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    image: bottleneck-web:local
    user: "1000:1000"
    read_only: true
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      api: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data     # certificates: losing this means re-issuing (rate limits)
      - caddy_config:/config
    tmpfs: [/tmp]
    networks: [edge]
    mem_limit: 128m
    cpus: 0.5

networks:
  # No route to the outside world: db and sidecar cannot call out, nothing outside can call in.
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 10.89.1.0/24

volumes:
  dbdata:
  uploads:
  caddy_data:
  caddy_config:
