name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Schema, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The "CI version" of Node that determinism checks compare against (invariant 1).
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generated schema types are up to date
        run: npm run schema:check

      - run: npm run lint

      - run: npm run typecheck

      - name: Unit and validation tests
        run: npm test

      - name: Build the web app
        run: npm run build

  e2e:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Determinism (Node vs Web Worker) and smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  api:
    name: API (.NET build, C# schema check, tests with Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/api/global.json

      # NuGet audit runs during restore; with TreatWarningsAsErrors a package with a known advisory fails the build.
      - name: Restore
        run: dotnet restore Bottleneck.Api.slnx

      - name: Generated C# schema classes are up to date
        run: dotnet run --project tools/Bottleneck.SchemaGen --no-restore -- --check

      - name: Build
        run: dotnet build Bottleneck.Api.slnx --no-restore --configuration Release

      - name: Unit and integration tests (PostgreSQL via Testcontainers; Docker is preinstalled on the runner)
        run: dotnet test --solution Bottleneck.Api.slnx --no-build --configuration Release
